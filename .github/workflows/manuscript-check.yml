
name: Manuscript formatting check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v5

      - name: Check Markdown formatting
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
